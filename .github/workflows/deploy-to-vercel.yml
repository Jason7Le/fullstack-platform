# 部署工作流文件，当GitHub有新的提交时，会自动部署到Vercel
name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/main-app/**'
      - 'apps/dashboard-app/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-to-vercel.yml'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check (optional)
        continue-on-error: true
        run: pnpm run lint:frontend || echo "⚠️ Lint 检查失败，继续构建"

      - name: Build frontend applications
        env:
          VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE || '全栈微前端数据平台' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.example.com' }}
          VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION || '1.0.0' }}
          VITE_REMOTE_DASHBOARD_URL: ${{ secrets.VITE_REMOTE_DASHBOARD_URL || '' }}
          VITE_WEB_VITALS_ENABLED: ${{ secrets.VITE_WEB_VITALS_ENABLED || 'true' }}
          VITE_WEB_VITALS_PAGES: ${{ secrets.VITE_WEB_VITALS_PAGES || '/dashboard,/dashboard-app,/login' }}
          VITE_MICRO_FRONTEND_ENABLED: ${{ secrets.VITE_MICRO_FRONTEND_ENABLED || 'true' }}
          VITE_MICRO_FRONTEND_PAGES: ${{ secrets.VITE_MICRO_FRONTEND_PAGES || '/dashboard-app' }}
          VITE_ERROR_MONITORING_ENABLED: ${{ secrets.VITE_ERROR_MONITORING_ENABLED || 'true' }}
          VITE_ERROR_MONITORING_PAGES: ${{ secrets.VITE_ERROR_MONITORING_PAGES || '/*' }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || '' }}
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT || 'https://api.example.com/api/analytics' }}
          VITE_WEBSOCKET_URL: ${{ secrets.VITE_WEBSOCKET_URL || 'wss://api.example.com' }}
        run: |
          echo "🏗️ 开始构建前端应用..."
          pnpm run build:frontend
          pnpm run build:dashboard
          echo "✅ 前端应用构建完成"

      - name: Verify build output
        run: |
          if [ ! -d "apps/main-app/dist" ] || [ ! -d "apps/main-app/dist/assets" ]; then
            echo "❌ 构建输出目录不存在或缺少 assets 目录"
            exit 1
          fi
          echo "✅ 构建输出验证通过"

      - name: Prepare Vercel output
        run: |
          mkdir -p dist
          cp -av apps/main-app/dist/. dist/
          # 确保测试页面存在
          if [ ! -f "dist/@test.html" ] && [ -f "apps/main-app/public/@test.html" ]; then
            cp apps/main-app/public/@test.html dist/@test.html
          fi
          echo "✅ 文件已复制到根目录 dist 文件夹"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_IGNORE_BUILD_STEP: 1
        run: |
          # 尝试更新 Vercel 项目配置（将 Root Directory 设置为根目录）
          curl -X PATCH "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "."}' \
            2>/dev/null || echo "⚠️ 无法自动更新项目配置，请在 Vercel 控制台手动设置 Root Directory 为 '.'"

          # 部署到生产环境
          vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --force --cwd . || {
            echo "❌ 部署失败"
            exit 1
          }
          echo "✅ 部署成功完成"

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ 部署成功 - 请查看 Vercel 控制台获取最新部署 URL"
          else
            echo "❌ 部署失败 - 请查看上方错误日志"
          fi
