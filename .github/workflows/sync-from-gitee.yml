# 同步工作流文件，当Gitee有新的提交时，会自动同步到GitHub
name: Sync from Gitee

on:
  # 支持通过 repository_dispatch 手动触发（需要配置 Gitee Webhook）
  repository_dispatch:
    types: [gitee-push]
  # 支持定时同步（可选，每天凌晨2点执行一次）
  # schedule:
  #   - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # GitHub个人访问令牌
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME || 'lixuejian' }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL || 'jasonleechain@163.com' }}"

      - name: Setup SSH for Gitee
        run: |
          mkdir -p ~/.ssh
          # 如果您的 SSH 密钥类型是 RSA，请将 id_ed25519 改为 id_rsa
          echo "${{ secrets.SYNC_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          # 配置 SSH 连接参数
          echo "Host gitee.com" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile ~/.ssh/known_hosts" >> ~/.ssh/config

      - name: Add Gitee Remote and Check Updates
        id: check-updates
        run: |
          # 添加 Gitee 远程仓库（如果已存在则先移除）
          git remote remove gitee 2>/dev/null || true
          git remote add gitee git@gitee.com:sun-lixuejian/fullstack-platform.git

          # 获取 Gitee 的最新代码
          git fetch gitee main

          # 检查是否有新的提交
          LOCAL=$(git rev-parse main)
          REMOTE=$(git rev-parse gitee/main)

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ Gitee 和 GitHub 已同步，无需更新"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "🔄 检测到 Gitee 有新提交，准备同步"
            # 显示待同步的提交
            echo "待同步的提交："
            git log --oneline main..gitee/main
          fi

      - name: Sync from Gitee
        if: steps.check-updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 切换到 main 分支
          git checkout main

          # 配置 origin 使用 token 进行推送（使用 x-access-token 作为用户名更安全）
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

          # 尝试合并 Gitee 的更改（使用 rebase 策略，保持历史线性）
          set +e
          git pull gitee main --rebase --no-edit
          REBASE_EXIT_CODE=$?

          if [ $REBASE_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Rebase 失败，尝试使用 merge 策略"
            # 如果 rebase 失败，回退并使用 merge
            git rebase --abort 2>/dev/null || true
            git merge gitee/main --no-edit -m "Auto-sync from Gitee: $(date +'%Y-%m-%d %H:%M:%S')"
          else
            echo "✅ Rebase 成功"
          fi

          # 推送到 GitHub
          git push origin main
          echo "✅ 同步完成，已推送到 GitHub"

      - name: Sync Summary
        if: always()
        run: |
          if [ "${{ steps.check-updates.outputs.has_updates }}" = "true" ]; then
            echo "✅ 同步任务完成"
          else
            echo "ℹ️ 无需同步，代码已是最新"
          fi
