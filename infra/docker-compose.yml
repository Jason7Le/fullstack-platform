# infra/docker-compose.yml
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user_db       # 确保这个数据库名存在
      MYSQL_USER: app_user          # 确保这个用户名存在
      MYSQL_PASSWORD: userpassword  # 确保这个密码正确
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: 
      --default-authentication-plugin=mysql_native_password # 确保使用正确的认证插件

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: